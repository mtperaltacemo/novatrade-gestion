<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1c3556">
<title>Seguimiento de su pedido · Novatrade</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f3f6fa;--card:#fff;--ink:#14243a;--muted:#5d6e84;--line:#dbe3ee;--navy:#1c3556;--accent:#2b7fc4;--good:#1f9d62;--warn:#c47a10;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#0e1622;--card:#16222f;--ink:#e8eef6;--muted:#98a9bd;--line:#26374a;--navy:#a9c8ea;--accent:#5aa9e8;--good:#3dc487;--warn:#e5a13a;--bad:#ef6b5c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.top{background:#1c3556;color:#fff;padding:18px 16px calc(18px + 0px);display:flex;align-items:center;gap:12px}
.top img{width:40px;height:40px;border-radius:10px}
.top b{font-size:18px;letter-spacing:.01em}.top small{display:block;opacity:.8;font-size:13px}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:13px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
p{margin:0}.muted{color:var(--muted);font-size:14px}
form{display:flex;gap:8px;margin-top:12px}
input{flex:1;min-width:0;font:inherit;font-size:18px;letter-spacing:.08em;text-transform:uppercase;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;background:var(--accent);color:#fff;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.now{display:flex;flex-direction:column;gap:4px}
.badge{align-self:flex-start;padding:6px 14px;border-radius:999px;font-weight:800;font-size:15px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.badge.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.badge.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.eta{font-size:15px;margin-top:6px}.eta b{font-size:17px}
ol{list-style:none;margin:0;padding:0}
li{position:relative;padding:0 0 18px 38px;min-height:40px}
li:last-child{padding-bottom:0}
li::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
li:last-child::before{display:none}
li i{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800;color:#fff}
li.done i{background:var(--good);border-color:var(--good)}li.done::before{background:var(--good)}
li.cur i{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent)}
li b{display:block;line-height:24px}li span{font-size:13px;color:var(--muted)}
li:not(.done):not(.cur) b{color:var(--muted);font-weight:600}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:15px}dt{color:var(--muted)}dd{margin:0;font-weight:600;word-break:break-word}
.err{color:var(--bad);font-weight:600;margin-top:10px}
.foot{text-align:center;font-size:12px;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="top"><img src="icon-192.png" alt=""><div><b>NOVATRADE</b><small>Seguimiento de su pedido</small></div></div>
<main>
  <div class="card" id="buscar">
    <h1>Consulte el estado de su pedido</h1>
    <p class="muted">Escriba el código de seguimiento que le enviamos.</p>
    <form id="f"><input id="code" placeholder="NT-XXXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Código de seguimiento"><button type="submit">Ver</button></form>
    <p class="err" id="err" hidden></p>
  </div>
  <div id="res" hidden>
    <div class="card now"><p class="muted" id="rCli"></p><h1 id="rProd"></h1><p class="muted" id="rNum"></p><span class="badge" id="rEtapa"></span><p class="eta" id="rEta"></p></div>
    <div class="card"><h2>Avance</h2><ol id="rSteps"></ol></div>
    <div class="card" id="cCom" hidden><h2>Información</h2><p id="rCom" style="white-space:pre-wrap"></p></div>
    <div class="card" id="cEnv"><h2>Embarque</h2><dl id="rEnv"></dl><div id="rTrk" hidden style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn ghost" id="rTrkA" target="_blank" rel="noopener">Rastrear en la naviera</a><button class="btn ghost" id="rTrkC" type="button">Copiar N.º</button></div><p class="muted" id="rTrkH" style="margin-top:8px" hidden></p></div>
    <div class="card"><h2>¿Consultas?</h2><p class="muted" style="margin-bottom:12px" id="rTel"></p><a class="btn" id="rWa" target="_blank" rel="noopener">Escribirnos por WhatsApp</a></div>
    <p class="foot" id="rUpd"></p>
  </div>
</main>
<script>
/* Prefijo de las colecciones: 'test_' en modo prueba; vacío en producción. Debe coincidir con CP del index.html */
const CP='test_';
const PROJ='crm-novatrade',KEY='AIzaSyA2J3Z4gHQyYYvU8AzSVs9r_L_DG6Ax9AE';
const ETAPAS=[['enviada','Cotización enviada'],['confirmada','Confirmada'],['pedido','Pedido realizado'],['transito','En tránsito'],['puerto','Arribado a puerto'],['aduanap','Arribo parcial en aduana'],['aduana','Arribo en aduana'],['demorado','Demorado por aduana'],['disponible','Disponible para entrega'],['entregap','Entregado parcial'],['entregada','Entrega finalizada']];
const $=s=>document.querySelector(s);
let timer=null,cur='';
function val(v){ // valor tipado de Firestore REST -> JS
  if(v==null)return null;
  if('stringValue' in v)return v.stringValue;
  if('integerValue' in v)return +v.integerValue;
  if('doubleValue' in v)return v.doubleValue;
  if('booleanValue' in v)return v.booleanValue;
  if('nullValue' in v)return null;
  if('arrayValue' in v)return (v.arrayValue.values||[]).map(val);
  if('mapValue' in v){const o={};for(const k in (v.mapValue.fields||{}))o[k]=val(v.mapValue.fields[k]);return o}
  return null}
const fd=(ts)=>new Date(ts).toLocaleDateString('es-BO',{day:'2-digit',month:'2-digit',year:'numeric'});
const fdi=s=>{const[a,b,c]=s.split('-');return `${c}/${b}/${a}`};
function norm(c){c=String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.startsWith('NT'))c=c.slice(2);return c?'NT-'+c:''}
async function load(code,quiet){
  const url=`https://firestore.googleapis.com/v1/projects/${PROJ}/databases/(default)/documents/${CP}seguimiento/${encodeURIComponent(code)}?key=${KEY}`;
  let r;try{r=await fetch(url)}catch(e){if(!quiet)fail('No se pudo conectar. Revise su conexión a internet.');return}
  if(!r.ok){if(!quiet)fail('No encontramos ese código. Revíselo e intente de nuevo.');return}
  const d=val({mapValue:{fields:(await r.json()).fields||{}}});
  if(!d||d.activo===false){if(!quiet)fail('No encontramos ese código. Revíselo e intente de nuevo.');return}
  show(d,code)}
function fail(m){const e=$('#err');e.textContent=m;e.hidden=false;$('#res').hidden=true}
function show(d,code){
  $('#err').hidden=true;cur=code;
  try{history.replaceState(null,'','?c='+code)}catch(_){}
  $('#rCli').textContent=d.cliente?'Pedido de '+d.cliente:'';
  $('#rProd').textContent=d.producto||'Su pedido';
  $('#rNum').textContent=d.numero?'Cotización '+d.numero:'';
  const e=d.etapa,idx=ETAPAS.findIndex(x=>x[0]===e),b=$('#rEtapa');
  b.textContent=e==='cancelada'?'Sin efecto':(ETAPAS[idx]||['',''])[1];b.className='badge'+(e==='entregada'||e==='disponible'||e==='entregap'?' ok':e==='cancelada'||e==='demorado'?' bad':'');
  let eta='';
  if(d.eta&&e!=='entregada'&&e!=='cancelada'){const n=Math.round((new Date(d.eta+'T12:00:00')-new Date(new Date().toISOString().slice(0,10)+'T12:00:00'))/864e5);
    eta=`Llegada estimada: <b>${fdi(d.eta)}</b>`+(n>0?` (en ${n} día${n===1?'':'s'})`:n===0?' (hoy)':' (en revisión)')}
  else if(e==='entregada')eta='Su pedido fue entregado. ¡Gracias por su confianza!';
  $('#rEta').innerHTML=eta;
  const hist=d.hist||[];
  $('#rSteps').innerHTML=ETAPAS.map(([k,l],i)=>({k,l,i})).filter(o=>!['demorado','aduanap','entregap','puerto'].includes(o.k)||e===o.k||hist.some(x=>x.etapa===o.k)).map(({k,l,i})=>{const h=hist.slice().reverse().find(x=>x.etapa===k);
    const cls=e==='cancelada'?(h?'done':''):i<idx?'done':i===idx?'cur':'';
    return `<li class="${cls}"><i>${cls==='done'?'✓':''}</i><b>${l}</b><span>${h?fd(h.ts):(cls?'':'Pendiente')}</span></li>`}).join('');
  const env=[['Tipo de transporte',d.modalidad],['Naviera',d.naviera],['Contenedor',d.contenedor],['Documento de embarque',d.bl],['Fecha de embarque',(d.etd||d.salida)?fdi(d.etd||d.salida):''],['Llegada a puerto',d.eta?fdi(d.eta):''],['Entrega estimada',d.entrega?fdi(d.entrega):'']].filter(x=>x[1]);
  $('#cEnv').hidden=!env.length;$('#rEnv').innerHTML=env.map(([a,b])=>`<dt>${a}</dt><dd>${String(b).replace(/</g,'&lt;')}</dd>`).join('');
  {const tr=$('#rTrk'),ok=!!(d.rastreo&&d.rastreoNum&&e!=='entregada'&&e!=='cancelada');tr.hidden=!ok;$('#rTrkH').hidden=!ok;
   if(ok){$('#rTrkA').href=d.rastreo;$('#rTrkH').textContent='Copie el número '+d.rastreoNum+' y péguelo en la página de la naviera si se lo pide.';$('#rTrkC').onclick=()=>{try{navigator.clipboard.writeText(d.rastreoNum).then(()=>{$('#rTrkC').textContent='Copiado'},()=>{})}catch(_){}}}}
  $('#cCom').hidden=!d.comentario;$('#rCom').textContent=d.comentario||'';
  $('#rTel').textContent=d.tel?'Novatrade · '+d.tel:'';
  const num=(String(d.tel||'').match(/\+?\d[\d ]{6,}/)||[''])[0].replace(/\D/g,'');
  const w=$('#rWa');w.hidden=!num;if(num)w.href='https://wa.me/'+num+'?text='+encodeURIComponent('Hola, consulto por mi pedido '+(d.numero||'')+' (código '+code+').');
  $('#rUpd').textContent=d.upd?'Última actualización: '+fd(d.upd):'';
  $('#res').hidden=false;
  clearInterval(timer);timer=setInterval(()=>load(code,true),60000)}
$('#f').addEventListener('submit',ev=>{ev.preventDefault();const c=norm($('#code').value);if(!c){fail('Escriba su código de seguimiento.');return}load(c)});
{const q=new URLSearchParams(location.search).get('c');if(q){const c=norm(q);$('#code').value=c;load(c)}}
</script>
</body>
</html>
